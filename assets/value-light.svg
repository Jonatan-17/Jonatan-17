<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" fill="none" role="img" aria-labelledby="t d">
<title id="t">Lo que aporto</title><desc id="d">APIs seguras, datos bien modelados y automatización con IA.</desc>
<style>text{font-family:Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif}.m{font-family:SFMono-Regular, Consolas, Menlo, 'Liberation Mono', monospace}.pulse{animation:p 2.4s ease-in-out infinite}.blink{animation:b 1.1s steps(2,end) infinite}@keyframes p{50%{opacity:.35}}@keyframes b{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.pulse,.blink{animation:none}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F8FB"/></linearGradient><linearGradient id="brand" x1="0" x2="1"><stop stop-color="#EA580C"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
<rect x=".5" y=".5" width="1199" height="249" rx="20" fill="url(#bg)" stroke="#D8E0EA"/>
<text class="m" x="44" y="54" font-size="14" fill="#94A3B8" letter-spacing="2">LO QUE APORTO A UN EQUIPO</text><rect x="44.0" y="76" width="357.3333333333333" height="140" rx="14" fill="#FFFFFF" stroke="#D8E0EA"/><rect x="44.0" y="76" width="5" height="140" rx="2.5" fill="#EA580C"/><text class="m" x="72.0" y="112" font-size="14" fill="#EA580C">01</text><text x="104.0" y="113" font-size="22" font-weight="700" fill="#0F172A">APIs seguras</text><text x="72.0" y="152" font-size="16" fill="#475569">REST con Spring Boot, JWT, roles,</text><text x="72.0" y="178" font-size="16" fill="#475569">validación y manejo de errores.</text><rect x="421.3333333333333" y="76" width="357.3333333333333" height="140" rx="14" fill="#FFFFFF" stroke="#D8E0EA"/><rect x="421.3333333333333" y="76" width="5" height="140" rx="2.5" fill="#2563EB"/><text class="m" x="449.3333333333333" y="112" font-size="14" fill="#2563EB">02</text><text x="481.3333333333333" y="113" font-size="22" font-weight="700" fill="#0F172A">Datos bien modelados</text><text x="449.3333333333333" y="152" font-size="16" fill="#475569">PostgreSQL y MySQL, JPA/Hibernate,</text><text x="449.3333333333333" y="178" font-size="16" fill="#475569">triggers, procedimientos y vistas.</text><rect x="798.6666666666666" y="76" width="357.3333333333333" height="140" rx="14" fill="#FFFFFF" stroke="#D8E0EA"/><rect x="798.6666666666666" y="76" width="5" height="140" rx="2.5" fill="#16A34A"/><text class="m" x="826.6666666666666" y="112" font-size="14" fill="#16A34A">03</text><text x="858.6666666666666" y="113" font-size="22" font-weight="700" fill="#0F172A">Automatización con IA</text><text x="826.6666666666666" y="152" font-size="16" fill="#475569">Flujos en n8n, RAG con Qdrant,</text><text x="826.6666666666666" y="178" font-size="16" fill="#475569">visión por computador y bots.</text></svg>
