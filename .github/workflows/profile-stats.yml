name: Actualizar panel de GitHub

on:
  schedule:
    - cron: "23 10 * * *"   # todos los días, 5:23 a. m. hora de Colombia
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - scripts/build_cards.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar panel con datos públicos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py
      # El panel se guarda en la rama "stats" para que el historial de main
      # (y la lista de contribuidores del repo) quede solo con commits del autor.
      - name: Publicar en la rama stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin stats; then
            git fetch origin stats
            git worktree add /tmp/stats origin/stats
            cd /tmp/stats && git switch -c stats
          else
            git worktree add --detach /tmp/stats
            cd /tmp/stats && git switch --orphan stats
          fi
          cp "$GITHUB_WORKSPACE"/assets/stats/github-*.svg .
          git add github-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar panel de estadísticas"
            git push origin stats
          fi
