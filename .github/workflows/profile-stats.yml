name: Actualizar panel de GitHub

on:
  schedule:
    - cron: "23 10 * * *"   # todos los días, 5:23 a. m. hora de Colombia
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - scripts/build_cards.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar panel con datos públicos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar panel de estadísticas"
            git push
          fi
